name: Fly Deploy

on:
  push:
    branches:
      - main
      - v2-pipeline
      - claude/uksc-v2-pipeline-c2e2zq

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency: fly-deploy
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Ensure app, volume and secrets exist, then deploy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "::error::GitHub secret FLY_API_TOKEN is not set. Fly dashboard → Tokens → create token, then GitHub repo → Settings → Secrets and variables → Actions → New repository secret (name FLY_API_TOKEN)."
            exit 1
          fi

          # Create the app if it doesn't exist yet (needs an org-level token;
          # an app-scoped deploy token only works once the app exists).
          if ! flyctl status -a uksc > /dev/null 2>&1; then
            echo "App 'uksc' not found — creating it"
            flyctl apps create uksc
          fi

          # Create the data volume if missing (mounted at /data per fly.toml).
          if ! flyctl volumes list -a uksc 2>/dev/null | grep -qw data; then
            echo "Volume 'data' not found — creating 3GB in lhr"
            flyctl volumes create data --size 3 --region lhr -a uksc --yes
          fi

          # The app cannot boot without DATABASE_URL — fail early with a clear
          # message instead of a confusing health-check timeout.
          SECRETS=$(flyctl secrets list -a uksc 2>/dev/null || true)
          if ! echo "$SECRETS" | grep -qw DATABASE_URL; then
            echo "::error::Fly secret DATABASE_URL is not set. Fly dashboard → app 'uksc' → Secrets → add DATABASE_URL (your Neon connection string), plus APP_PASSWORD, TELEGRAM_API_ID, TELEGRAM_API_HASH, TELEGRAM_SESSION, ANTHROPIC_KEY, SHOPIFY_TOKEN, SHOPIFY_DOMAIN, PUBLISH_STATUS. Then re-run this workflow."
            exit 1
          fi
          for s in APP_PASSWORD TELEGRAM_SESSION ANTHROPIC_KEY SHOPIFY_TOKEN; do
            echo "$SECRETS" | grep -qw "$s" || echo "::warning::Fly secret $s is not set yet — the app will boot but that feature will be off."
          done

          flyctl deploy --remote-only
