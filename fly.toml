# Fly.io config for the UKSC pipeline.
app = "uksc"
primary_region = "lhr"

[build]

[env]
  PORT = "3000"
  DATA_DIR = "/data"
  APP_URL = "https://uksc.fly.dev"

[mounts]
  source = "data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  # The userbot + cron must keep running even with no web traffic:
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/healthz"
